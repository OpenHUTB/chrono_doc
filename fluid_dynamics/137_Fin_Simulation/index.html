                <div><h1 id="_1">柔性鳍状结构模拟</h1>
<p>“柔性鳍状结构（Fin Simulation）”在流体中运动与变形的数值模拟是一类典型的流固耦合问题，主要研究柔性结构如何与流体相互作用以产生推力或控制流动。
常见于水下机器人、仿生推进、流动控制等场景。</p></div>
